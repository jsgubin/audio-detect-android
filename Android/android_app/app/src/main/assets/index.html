<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>实时环境音识别系统</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            margin: 0;
            padding: 12px;
            min-height: 100vh;
        }
        h1 { 
            text-align: center; 
            color: #2c3e50; 
            font-size: 1.4em;
            margin: 8px 0 16px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .settings-btn {
            background: #7f8c8d;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .server-status {
            font-size: 11px;
            color: #7f8c8d;
        }
        .controls { 
            display: flex;
            flex-direction: column;
            gap: 12px; 
            margin-bottom: 16px; 
            background: white; 
            padding: 16px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
        }
        .control-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        button { 
            padding: 12px 24px; 
            font-size: 15px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            transition: 0.2s; 
            font-weight: bold;
            flex: 1;
            max-width: 140px;
        }
        #startBtn { background-color: #27ae60; }
        #startBtn:hover, #startBtn:active { background-color: #219653; }
        #stopBtn { background-color: #c0392b; }
        #stopBtn:hover, #stopBtn:active { background-color: #a93226; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        select, input[type="number"] {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #bdc3c7;
            font-size: 14px;
            min-width: 80px;
        }

        .status { 
            text-align: center; 
            font-weight: bold; 
            margin-bottom: 12px; 
            color: #f39c12; 
            font-size: 1em;
            min-height: 24px;
        }

        .log-container { 
            background: white; 
            padding: 16px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
            min-height: 300px;
            max-height: 50vh;
            overflow-y: auto;
        }
        
        .log-entry { 
            padding: 12px; 
            border-bottom: 1px solid #ecf0f1; 
            animation: fadeIn 0.4s; 
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .log-entry:last-child { border-bottom: none; }
        
        .timestamp { 
            color: #7f8c8d; 
            font-size: 0.85em; 
            min-width: 70px;
            flex-shrink: 0;
        }
        .class-name { 
            font-weight: bold; 
            color: #e74c3c; 
            font-size: 1.1em; 
            flex-grow: 1;
        }
        .prob { 
            color: #2980b9; 
            font-weight: bold;
            background: #eaf2f8;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.9em;
            flex-shrink: 0;
        }
        
        .wave {
            display: inline-block;
            width: 3px;
            height: 15px;
            background-color: #27ae60;
            margin: 0 2px;
            animation: wave 1s infinite linear;
            display: none;
        }
        .wave:nth-child(2) { animation-delay: 0.2s; }
        .wave:nth-child(3) { animation-delay: 0.4s; }
        .wave:nth-child(4) { animation-delay: 0.6s; }
        
        @keyframes wave {
            0%, 100% { height: 5px; }
            50% { height: 15px; }
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(-8px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .empty-msg {
            text-align: center;
            color: #95a5a6;
            margin-top: 100px;
            font-style: italic;
            font-size: 0.95em;
        }

        .no-server {
            text-align: center;
            color: #c0392b;
            padding: 20px;
            background: #fdeaea;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .no-server button {
            margin-top: 12px;
            background: #c0392b;
            max-width: 200px;
        }

        /* 移动端优化 */
        @media (max-width: 480px) {
            h1 { font-size: 1.2em; }
            .control-row { gap: 8px; }
            button { padding: 10px 16px; font-size: 14px; }
            .log-entry { padding: 10px 8px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="server-status" id="serverStatus">服务器: 未配置</div>
        <button class="settings-btn" onclick="openSettings()">⚙️ 设置</button>
    </div>

    <h1>🎤 实时环境音识别系统</h1>
    
    <div class="controls">
        <div class="control-row">
            <div>
                <label for="modelSelect">引擎：</label>
                <select id="modelSelect">
                    <option value="efficientat">EfficientAT V3</option>
                    <option value="mobilenet">MobileNetV1</option>
                    <option value="ast">AST 七分类 (10秒)</option>
                </select>
            </div>

            <div style="display:flex; gap:10px; align-items:flex-end; font-size:12px;">
                <div>
                    <label for="vadThreshold">静音阈值</label><br>
                    <input type="number" id="vadThreshold" value="0.03" step="0.01" min="0" max="0.20" style="width:52px">
                </div>
                <div>
                    <label for="confThreshold">置信度</label><br>
                    <input type="number" id="confThreshold" value="0.60" step="0.05" min="0.30" max="0.95" style="width:52px">
                </div>
            </div>
        </div>

        <div class="control-row">
            <button id="startBtn">▶ 开始监听</button>
            <button id="stopBtn" disabled>⏹ 停止</button>
            
            <div id="visualizer">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
        </div>
    </div>
    
    <div id="status" class="status">系统已就绪</div>
    
    <div id="noServerMsg" class="no-server" style="display:none;">
        <div>⚠️ 尚未配置后端服务器地址</div>
        <div style="font-size:13px; margin-top:6px; color:#7f8c8d;">
            请在设置中填写后端服务地址，例如：<br>
            http://192.168.1.100:8000
        </div>
        <button onclick="openSettings()">去设置</button>
    </div>

    <div class="log-container" id="logContainer">
        <div class="empty-msg" id="emptyMsg">正在等待识别...<br>(环境中出现目标声音时将在此处显示)</div>
    </div>

    <script>
        // ========== 服务器地址配置 ==========
        let SERVER_URL = '';
        
        function loadServerUrl() {
            // 优先从Android原生接口获取
            if (typeof Android !== 'undefined' && Android.getServerUrl) {
                SERVER_URL = Android.getServerUrl();
            } else {
                // 浏览器环境：从localStorage读取
                SERVER_URL = localStorage.getItem('server_url') || '';
            }
            updateServerStatus();
        }

        function updateServerStatus() {
            const statusEl = document.getElementById('serverStatus');
            const noServerEl = document.getElementById('noServerMsg');
            if (!SERVER_URL || SERVER_URL === '') {
                statusEl.textContent = '服务器: 未配置';
                statusEl.style.color = '#c0392b';
                noServerEl.style.display = 'block';
            } else {
                statusEl.textContent = '服务器: ' + SERVER_URL;
                statusEl.style.color = '#27ae60';
                noServerEl.style.display = 'none';
            }
        }

        function openSettings() {
            if (typeof Android !== 'undefined' && Android.openSettings) {
                Android.openSettings();
            } else {
                const url = prompt('请输入后端服务器地址:', SERVER_URL || 'http://192.168.1.100:8000');
                if (url) {
                    SERVER_URL = url.trim();
                    localStorage.setItem('server_url', SERVER_URL);
                    updateServerStatus();
                }
            }
        }

        // ========== 录音与识别逻辑 ==========
        let stream;
        let isRecording = false;
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const logContainer = document.getElementById('logContainer');
        const modelSelect = document.getElementById('modelSelect');
        const vadThresholdInput = document.getElementById('vadThreshold');
        const confThresholdInput = document.getElementById('confThreshold');
        const emptyMsg = document.getElementById('emptyMsg');
        const waves = document.querySelectorAll('.wave');

        modelSelect.addEventListener('change', () => {
            if (confThresholdInput) {
                confThresholdInput.value = (modelSelect.value === 'mobilenet') ? '0.65' : '0.60';
            }
        });

        const trans = {
            'alarm': '🚨 警报声',
            'baby_cry': '👶 婴儿啼哭',
            'car_horn': '🚗 汽车鸣笛',
            'doorbell': '🚪 门铃声',
            'glass_shatter': '💥 玻璃破碎',
            'gun_shot': '🔫 枪声'
        };

        function checkMicrophoneAvailable() {
            const hasMediaDevices = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
            const isSecure = window.isSecureContext;
            if (!hasMediaDevices || !isSecure) {
                startBtn.disabled = true;
                startBtn.style.backgroundColor = '#95a5a6';
                statusDiv.textContent = "麦克风不可用：请检查权限";
                statusDiv.style.color = "#c0392b";
                if (emptyMsg) {
                    emptyMsg.innerHTML = "⚠️ 麦克风不可用<br>请检查应用权限设置";
                }
                return false;
            }
            return true;
        }

        window.addEventListener('load', () => {
            loadServerUrl();
            checkMicrophoneAvailable();
        });

        window.addEventListener('focus', () => {
            loadServerUrl();
        });

        startBtn.addEventListener('click', async () => {
            loadServerUrl();
            if (!SERVER_URL) {
                alert('请先配置后端服务器地址！\n\n点击右上角"设置"按钮进行配置。');
                return;
            }
            if (!checkMicrophoneAvailable()) {
                alert('无法访问麦克风，请在系统设置中授予麦克风权限。');
                return;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isRecording = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusDiv.textContent = "🎙️ 正在实时监听中...";
                statusDiv.style.color = "#27ae60";
                waves.forEach(w => w.style.display = 'inline-block');
                recordLoop();
            } catch (err) {
                let msg = "无法访问麦克风\n\n";
                if (err && err.name === 'NotAllowedError') {
                    msg += "用户拒绝了麦克风权限，请在系统设置中允许应用使用麦克风。";
                } else {
                    msg += "报错: " + err;
                }
                alert(msg);
            }
        });

        stopBtn.addEventListener('click', () => {
            isRecording = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            if (currentAudioCtx) {
                try { currentAudioCtx.close(); } catch(e) {}
                currentAudioCtx = null;
            }
            if (currentProcessor) {
                try { currentProcessor.disconnect(); } catch(e) {}
                currentProcessor = null;
            }
            if (currentSource) {
                try { currentSource.disconnect(); } catch(e) {}
                currentSource = null;
            }
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.textContent = "监听已暂停";
            statusDiv.style.color = "#f39c12";
            waves.forEach(w => w.style.display = 'none');
        });

        let currentAudioCtx = null;
        let currentSource = null;
        let currentProcessor = null;

        function encodeWAV(samples, sampleRate) {
            const buffer = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buffer);
            function writeString(offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + samples.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, samples.length * 2, true);
            for (let i = 0; i < samples.length; i++) {
                let s = Math.max(-1, Math.min(1, samples[i]));
                s = s < 0 ? s * 0x8000 : s * 0x7FFF;
                view.setInt16(44 + i * 2, s, true);
            }
            return new Blob([view], { type: 'audio/wav' });
        }

        function recordLoop() {
            if (!isRecording) return;
            const chunkSec = (modelSelect.value === 'ast') ? 10 : 3;
            const sampleRate = 16000;
            const ctx = new AudioContext({ sampleRate: sampleRate });
            currentAudioCtx = ctx;
            const src = ctx.createMediaStreamSource(stream);
            currentSource = src;
            const proc = ctx.createScriptProcessor(4096, 1, 1);
            currentProcessor = proc;
            const pcmChunks = [];

            src.connect(proc);
            proc.connect(ctx.destination);

            proc.onaudioprocess = (e) => {
                if (!isRecording) return;
                pcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
            };

            setTimeout(() => {
                proc.disconnect();
                src.disconnect();
                ctx.close();
                currentAudioCtx = null;
                currentSource = null;
                currentProcessor = null;
                if (!isRecording) return;
                const totalLen = pcmChunks.reduce((sum, arr) => sum + arr.length, 0);
                const merged = new Float32Array(totalLen);
                let offset = 0;
                for (const arr of pcmChunks) {
                    merged.set(arr, offset);
                    offset += arr.length;
                }
                const wavBlob = encodeWAV(merged, sampleRate);
                sendToBackend(wavBlob);
                if (isRecording) {
                    recordLoop();
                }
            }, chunkSec * 1000);
        }

        async function sendToBackend(audioBlob) {
            if (!SERVER_URL) return;
            const formData = new FormData();
            formData.append("audio", audioBlob, "chunk.wav");
            formData.append("model_choice", modelSelect.value);
            if (vadThresholdInput) formData.append("vad_threshold", vadThresholdInput.value);
            if (confThresholdInput) formData.append("conf_threshold", confThresholdInput.value);

            try {
                const response = await fetch(SERVER_URL + '/predict', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.status === "success" && data.detections.length > 0) {
                    if (emptyMsg) emptyMsg.style.display = 'none';
                    data.detections.forEach(det => {
                        addLogEntry(det.class, det.prob);
                    });
                }
            } catch (err) {
                console.error("请求失败:", err);
                statusDiv.textContent = "⚠️ 服务器连接失败";
                statusDiv.style.color = "#c0392b";
            }
        }

        function addLogEntry(className, prob) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timeStr = new Date().toLocaleTimeString();
            const displayName = trans[className] || className;
            const probPercent = (prob * 100).toFixed(1) + "%";
            entry.innerHTML = `
                <span class="timestamp">[${timeStr}]</span> 
                <span class="class-name">${displayName}</span> 
                <span class="prob">置信度: ${probPercent}</span>
            `;
            logContainer.prepend(entry);
            if (logContainer.children.length > 51) { 
                logContainer.removeChild(logContainer.lastChild);
            }
        }
    </script>
</body>
</html>
