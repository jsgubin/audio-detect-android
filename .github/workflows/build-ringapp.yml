name: Build RingApp APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ringapp/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-ringapp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --licenses || true

      - name: Build RingApp Debug APK
        run: |
          ./gradlew :ringapp:assembleDebug --stacktrace --no-daemon > build.log 2>&1 || true
          echo "=== BUILD LOG (last 200 lines) ==="
          tail -n 200 build.log
          echo "=== ERROR SUMMARY ==="
          grep -E "ERROR|FAIL|Exception|cannot|error:" build.log | tail -20 || true
          if grep -q "BUILD FAILED" build.log; then exit 1; fi
          if [ ! -f ringapp/build/outputs/apk/debug/ringapp-debug.apk ]; then exit 1; fi
        timeout-minutes: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ringapp-build-log
          path: build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ringapp-debug-apk
          path: ringapp/build/outputs/apk/debug/ringapp-debug.apk
          if-no-files-found: error
