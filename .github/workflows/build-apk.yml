name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/android_offline/**'
      - 'Android/android_offline/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find project path
        id: find_path
        run: |
          if [ -d "android/android_offline" ] && [ -f "android/android_offline/gradlew" ]; then
            echo "path=android/android_offline" >> $GITHUB_OUTPUT
            echo "found at: android/android_offline"
          elif [ -d "Android/android_offline" ] && [ -f "Android/android_offline/gradlew" ]; then
            echo "path=Android/android_offline" >> $GITHUB_OUTPUT
            echo "found at: Android/android_offline"
          else
            echo "ERROR: cannot find android_offline project"
            ls -la
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ${{ steps.find_path.outputs.path }}/gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --licenses || true

      - name: Build APK with Gradle
        working-directory: ./${{ steps.find_path.outputs.path }}
        run: |
          echo "=== Gradle Version ==="
          ./gradlew --version
          echo "=== Starting Build ==="
          ./gradlew assembleDebug --stacktrace --info --no-daemon 2>&1 | tee build.log
        timeout-minutes: 20

      - name: Print build log on failure
        if: failure()
        working-directory: ./${{ steps.find_path.outputs.path }}
        run: |
          echo "=== BUILD FAILURE LOG (last 300 lines) ==="
          tail -n 300 build.log || true
          echo "=== Gradle errors ==="
          grep -i "error\|failed\|exception\|cannot" build.log | head -50 || true
          echo "=== END LOG ==="

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_path.outputs.path }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
