name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/android_offline/**'
      - 'Android/android_offline/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Find project path
        id: find_path
        run: |
          if [ -d "android/android_offline" ] && [ -f "android/android_offline/gradlew" ]; then
            echo "path=android/android_offline" >> $GITHUB_OUTPUT
            echo "found at: android/android_offline"
          elif [ -d "Android/android_offline" ] && [ -f "Android/android_offline/gradlew" ]; then
            echo "path=Android/android_offline" >> $GITHUB_OUTPUT
            echo "found at: Android/android_offline"
          else
            echo "ERROR: cannot find android_offline project"
            ls -la
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ${{ steps.find_path.outputs.path }}/gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --licenses || true

      - name: Show project files
        run: |
          echo "=== Project structure ==="
          ls -la ${{ steps.find_path.outputs.path }}/
          echo "=== app/build.gradle.kts ==="
          cat ${{ steps.find_path.outputs.path }}/app/build.gradle.kts
          echo "=== settings.gradle.kts ==="
          cat ${{ steps.find_path.outputs.path }}/settings.gradle.kts

      - name: Build APK with Gradle
        id: gradle_build
        working-directory: ./${{ steps.find_path.outputs.path }}
        run: ./gradlew assembleDebug --stacktrace --info --no-daemon
        timeout-minutes: 30

      - name: Print logs on failure
        if: failure() && steps.gradle_build.outcome == 'failure'
        working-directory: ./${{ steps.find_path.outputs.path }}
        run: |
          echo "=== Looking for build logs ==="
          find app/build -name "*.log" -o -name "*.txt" 2>/dev/null | head -20
          echo "=== Build output logs ==="
          ls -la app/build/outputs/logs/ 2>/dev/null || echo "No outputs/logs directory"
          echo "=== Gradle daemon logs ==="
          ls -la ~/.gradle/daemon/ 2>/dev/null || echo "No daemon logs"
          echo "=== Last 100 lines of any log ==="
          find app/build -name "*.log" -exec tail -n 100 {} \; 2>/dev/null || true
          echo "=== Gradle error summary ==="
          ./gradlew assembleDebug --dry-run --no-daemon 2>&1 | tail -50 || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_path.outputs.path }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure() && steps.gradle_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ steps.find_path.outputs.path }}/app/build/**/*.log
          if-no-files-found: ignore
