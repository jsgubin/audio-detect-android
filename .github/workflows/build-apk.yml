name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/android_offline/**'
      - 'Android/android_offline/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find project path
        id: find_path
        run: |
          if [ -d "android/android_offline" ] && [ -f "android/android_offline/gradlew" ]; then
            echo "path=android/android_offline" >> $GITHUB_OUTPUT
          elif [ -d "Android/android_offline" ] && [ -f "Android/android_offline/gradlew" ]; then
            echo "path=Android/android_offline" >> $GITHUB_OUTPUT
          else
            echo "ERROR: cannot find android_offline project"
            ls -la
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ${{ steps.find_path.outputs.path }}/gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --licenses || true

      - name: Build APK with Gradle (verbose output)
        working-directory: ./${{ steps.find_path.outputs.path }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon > build.log 2>&1 || true
          echo "=== BUILD LOG (last 200 lines) ==="
          tail -n 200 build.log
          echo "=== ERROR SUMMARY ==="
          grep -E "ERROR|FAIL|Exception|cannot|error:" build.log | tail -20 || true
          # 如果编译失败，返回非零退出码
          if grep -q "BUILD FAILED" build.log; then exit 1; fi
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then exit 1; fi
        timeout-minutes: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.find_path.outputs.path }}/build.log
        working-directory: ./${{ steps.find_path.outputs.path }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon > build.log 2>&1 || true
          echo "=== BUILD LOG (last 200 lines) ==="
          tail -n 200 build.log
          echo "=== ERROR SUMMARY ==="
          grep -E "ERROR|FAIL|Exception|cannot|error:" build.log | tail -20 || true
          # 如果编译失败，返回非零退出码
          if grep -q "BUILD FAILED" build.log; then exit 1; fi
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then exit 1; fi
        timeout-minutes: 30

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_path.outputs.path }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
