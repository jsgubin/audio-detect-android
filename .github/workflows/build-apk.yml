name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/android_offline/**'
      - 'Android/android_offline/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Find project path
        id: find_path
        run: |
          if [ -d "android/android_offline" ] && [ -f "android/android_offline/gradlew" ]; then
            echo "path=android/android_offline" >> $GITHUB_OUTPUT
            echo "found at: android/android_offline"
          elif [ -d "Android/android_offline" ] && [ -f "Android/android_offline/gradlew" ]; then
            echo "path=Android/android_offline" >> $GITHUB_OUTPUT
            echo "found at: Android/android_offline"
          else
            echo "ERROR: cannot find android_offline project"
            ls -la
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ${{ steps.find_path.outputs.path }}/gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --licenses || true

      - name: Show project files
        run: |
          echo "=== Project structure ==="
          ls -la ${{ steps.find_path.outputs.path }}/
          echo "=== app/build.gradle.kts ==="
          cat ${{ steps.find_path.outputs.path }}/app/build.gradle.kts

      - name: Build APK with Gradle
        id: gradle_build
        working-directory: ./${{ steps.find_path.outputs.path }}
        run: |
          ./gradlew assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee gradle-output.txt
          exit ${PIPESTATUS[0]}
        timeout-minutes: 30

      - name: Print last 500 lines of build output on failure
        if: failure() && steps.gradle_build.outcome == 'failure'
        working-directory: ./${{ steps.find_path.outputs.path }}
        run: |
          echo "=== BUILD OUTPUT (last 500 lines) ==="
          tail -n 500 gradle-output.txt || cat gradle-output.txt || echo "No output file"
          echo "=== ERROR SUMMARY ==="
          grep -E "ERROR|FAIL|error:|FAILED|cannot|Exception" gradle-output.txt | head -30 || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_path.outputs.path }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build output on failure
        if: failure() && steps.gradle_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-output
          path: ${{ steps.find_path.outputs.path }}/gradle-output.txt
          if-no-files-found: ignore
