<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时环境音识别系统</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        h1 { 
            text-align: center; 
            color: #2c3e50; 
        }
        .controls { 
            display: flex; 
            justify-content: center; 
            align-items: center;
            gap: 20px; 
            margin-bottom: 20px; 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        button { 
            padding: 10px 20px; 
            font-size: 16px; 
            cursor: pointer; 
            border: none; 
            border-radius: 5px; 
            color: white; 
            transition: 0.3s; 
            font-weight: bold;
        }
        #startBtn { background-color: #27ae60; }
        #startBtn:hover { background-color: #219653; }
        #stopBtn { background-color: #c0392b; }
        #stopBtn:hover { background-color: #a93226; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #bdc3c7;
            font-size: 14px;
        }

        .status { 
            text-align: center; 
            font-weight: bold; 
            margin-bottom: 15px; 
            color: #f39c12; 
            font-size: 1.2em;
        }

        .log-container { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            min-height: 400px; 
            max-height: 600px; 
            overflow-y: auto; 
        }
        
        .log-entry { 
            padding: 15px; 
            border-bottom: 1px solid #ecf0f1; 
            animation: fadeIn 0.5s; 
            display: flex;
            align-items: center;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .timestamp { 
            color: #7f8c8d; 
            font-size: 0.9em; 
            margin-right: 15px; 
            min-width: 80px;
        }
        .class-name { 
            font-weight: bold; 
            color: #e74c3c; 
            font-size: 1.2em; 
            flex-grow: 1;
        }
        .prob { 
            color: #2980b9; 
            font-weight: bold;
            background: #eaf2f8;
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        /* 音波动画效果 */
        .wave {
            display: inline-block;
            width: 3px;
            height: 15px;
            background-color: #27ae60;
            margin: 0 2px;
            animation: wave 1s infinite linear;
            display: none; /* 默认隐藏 */
        }
        .wave:nth-child(2) { animation-delay: 0.2s; }
        .wave:nth-child(3) { animation-delay: 0.4s; }
        .wave:nth-child(4) { animation-delay: 0.6s; }
        
        @keyframes wave {
            0%, 100% { height: 5px; }
            50% { height: 15px; }
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(-10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .empty-msg {
            text-align: center;
            color: #95a5a6;
            margin-top: 150px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>🎤 实时环境音识别系统</h1>
    
    <div class="controls">
        <div>
            <label for="modelSelect">引擎选择：</label>
            <select id="modelSelect">
                <option value="efficientat">EfficientAT V3 (zyx模型)</option>
                <option value="mobilenet">MobileNetV1 (jmy模型)</option>
                <option value="ast">AST 七分类 (xyr模型, 录10秒)</option>
            </select>
        </div>

        <!-- 可调阈值：前端直接传参给后端 -->
        <div style="display:flex; gap:12px; align-items:flex-end; font-size:12px;">
            <div>
                <label for="vadThreshold">静音阈值</label><br>
                <input type="number" id="vadThreshold" value="0.03" step="0.01" min="0" max="0.20" style="width:58px" title="峰值幅度低于此值则视为无有效声音（VAD）">
            </div>
            <div>
                <label for="confThreshold">置信度阈值</label><br>
                <input type="number" id="confThreshold" value="0.60" step="0.05" min="0.30" max="0.95" style="width:58px" title="只有置信度高于此值的检测结果才会被返回">
            </div>
        </div>

        <button id="startBtn">▶ 开始监听</button>
        <button id="stopBtn" disabled>⏹ 停止监听</button>
        
        <div id="visualizer">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
    </div>
    
    <div id="status" class="status">系统已就绪，请佩戴耳机或打开麦克风后点击开始。</div>
    
    <div class="log-container" id="logContainer">
        <div class="empty-msg" id="emptyMsg">正在等待识别...<br>(如果环境中出现设定的 6 种声音，将在此处显示)</div>
    </div>

    <script>
        let stream;
        let isRecording = false;
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const logContainer = document.getElementById('logContainer');
        const modelSelect = document.getElementById('modelSelect');
        const vadThresholdInput = document.getElementById('vadThreshold');
        const confThresholdInput = document.getElementById('confThreshold');
        const emptyMsg = document.getElementById('emptyMsg');
        const waves = document.querySelectorAll('.wave');

        // 根据选择的模型，建议一个合理的默认置信度阈值（用户仍可手动修改）
        modelSelect.addEventListener('change', () => {
            if (confThresholdInput) {
                confThresholdInput.value = (modelSelect.value === 'mobilenet') ? '0.65' : '0.60';
            }
        });

        // 音频类别名称中文映射
        const trans = {
            'alarm': '🚨 警报声',
            'baby_cry': '👶 婴儿啼哭',
            'car_horn': '🚗 汽车鸣笛',
            'doorbell': '🚪 门铃声',
            'glass_shatter': '💥 玻璃破碎',
            'gun_shot': '🔫 枪声'
        };

        // ========== 重要：本地测试麦克风权限检查 ==========
        // getUserMedia 必须在安全上下文 (localhost / https) 下才能使用
        function checkMicrophoneAvailable() {
            const isLocalhost = location.hostname === 'localhost' || 
                               location.hostname === '127.0.0.1' ||
                               location.hostname === '[::1]';
            
            const hasMediaDevices = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
            const isSecure = window.isSecureContext;

            if (!hasMediaDevices || !isSecure) {
                const errorMsg = 
                    "无法使用麦克风！\n\n" +
                    "当前访问地址：" + location.host + "\n\n" +
                    "浏览器只允许在以下情况下访问麦克风：\n" +
                    "  • 使用 http://localhost:8000\n" +
                    "  • 使用 http://127.0.0.1:8000\n" +
                    "  • 使用 https 网站\n\n" +
                    "请不要使用 IP 地址（如 192.168.x.x 或 0.0.0.0）访问本页面！\n" +
                    "请复制上面推荐的地址到浏览器重新打开。";
                
                startBtn.disabled = true;
                startBtn.style.backgroundColor = '#95a5a6';
                statusDiv.textContent = "请使用 localhost:8000 或 127.0.0.1:8000 访问以启用麦克风";
                statusDiv.style.color = "#c0392b";
                
                // 也更新空状态提示
                if (emptyMsg) {
                    emptyMsg.innerHTML = "⚠️ 麦克风不可用<br>请改用 <b>http://localhost:8000</b> 访问";
                }
                
                return false;
            }
            return true;
        }

        // 页面加载时立即检查
        window.addEventListener('load', () => {
            checkMicrophoneAvailable();
        });

        startBtn.addEventListener('click', async () => {
            // 先检查是否在安全上下文中
            if (!checkMicrophoneAvailable()) {
                alert("无法访问麦克风！\n\n请在浏览器地址栏输入：\nhttp://localhost:8000\n或\nhttp://127.0.0.1:8000\n\n（不能用 IP 地址）");
                return;
            }

            try {
                // 请求麦克风权限
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isRecording = true;
                
                // UI 状态切换
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusDiv.textContent = "🎙️ 正在实时监听中... (只输出设定的 6 种异常声音)";
                statusDiv.style.color = "#27ae60";
                waves.forEach(w => w.style.display = 'inline-block');
                
                // 启动循环录音逻辑
                recordLoop();
            } catch (err) {
                let msg = "无法访问麦克风，请在浏览器地址栏左侧授予麦克风权限！\n\n";
                if (err && err.name === 'NotAllowedError') {
                    msg += "用户拒绝了麦克风权限，请点击地址栏左侧的 🔒 图标允许。";
                } else if (!navigator.mediaDevices) {
                    msg += "当前页面不是安全上下文（必须用 localhost 或 https）。\n" +
                           "请使用 http://localhost:8000 访问！";
                } else {
                    msg += "报错信息: " + err;
                }
                alert(msg);
            }
        });

        stopBtn.addEventListener('click', () => {
            isRecording = false;
            
            // 关闭所有麦克风轨道
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            
            // UI 状态切换
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.textContent = "系统已暂停。";
            statusDiv.style.color = "#f39c12";
            waves.forEach(w => w.style.display = 'none');
        });

        // 核心逻辑：循环录制，按模型动态决定每段时长（AST=10秒，其他=3秒）
        function recordLoop() {
            if (!isRecording) return;

            const chunkSec = (modelSelect.value === 'ast') ? 10 : 3;

            // 使用 MediaRecorder 录制 webm 格式
            const recorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
            const chunks = [];

            recorder.ondataavailable = e => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            recorder.onstop = () => {
                if (chunks.length > 0 && isRecording) {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    sendToBackend(blob);
                }
            };

            recorder.start();

            // 精确地在 chunkSec 秒后停止当前录音，并递归开启下一段
            setTimeout(() => {
                if (recorder.state === 'recording') {
                    recorder.stop();
                    // 只要还没有点击停止按钮，立刻开启下一段监听
                    if (isRecording) {
                        recordLoop();
                    }
                }
            }, chunkSec * 1000);
        }

        // 发送音频并处理响应
        async function sendToBackend(audioBlob) {
            const formData = new FormData();
            formData.append("audio", audioBlob, "chunk.webm");
            formData.append("model_choice", modelSelect.value);

            // 把当前阈值传给后端（支持实时动态调整）
            if (vadThresholdInput) formData.append("vad_threshold", vadThresholdInput.value);
            if (confThresholdInput) formData.append("conf_threshold", confThresholdInput.value);

            try {
                // 这个请求发往我们后端的 FastAPI /predict 接口
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === "success" && data.detections.length > 0) {
                    // 如果识别出目标声音，隐藏空提示，追加日志
                    if (emptyMsg) emptyMsg.style.display = 'none';
                    
                    data.detections.forEach(det => {
                        addLogEntry(det.class, det.prob);
                    });
                }
                // “如果没有就不用做出任何反应”，所以 else 分支我们什么也不做
                
            } catch (err) {
                console.error("上传/识别音频失败:", err);
            }
        }

        // 向前端 UI 追加日志
        function addLogEntry(className, prob) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            
            const timeStr = new Date().toLocaleTimeString();
            const displayName = trans[className] || className;
            const probPercent = (prob * 100).toFixed(1) + "%";
            
            entry.innerHTML = `
                <span class="timestamp">[${timeStr}]</span> 
                <span class="class-name">${displayName}</span> 
                <span class="prob">置信度: ${probPercent}</span>
            `;
            
            // 把最新的识别结果插在列表最上方
            logContainer.prepend(entry);
            
            // 保持日志列表不要过长，防止内存溢出 (保留最新的 50 条)
            if (logContainer.children.length > 51) { 
                logContainer.removeChild(logContainer.lastChild);
            }
        }
    </script>
</body>
</html>
